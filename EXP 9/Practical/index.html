<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Preferences</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #f4f4f4;
            --card: #ffffff;
            --text: #222222;
            --secondary: #666666;
            --border: #dddddd;
            --accent: #76558f;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s ease;
        }

        body.dark {
            --background: #181818;
            --card: #252525;
            --text: #f5f5f5;
            --secondary: #bdbdbd;
            --border: #444444;
        }

        .container {
            width: 90%;
            max-width: 550px;
            background: var(--card);
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: 0.3s ease;
        }

        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: var(--secondary);
            margin-bottom: 30px;
        }

        .setting {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            font-size: 15px;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            color: var(--accent);
            font-weight: bold;
            min-height: 20px;
        }

        .storage-info {
            margin-top: 25px;
            padding: 15px;
            background: var(--background);
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.7;
            color: var(--secondary);
        }

        .storage-info strong {
            color: var(--accent);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>User Preferences</h1>

        <p class="description">
            Customize and save your personal preferences.
        </p>

        <div class="setting">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your name">
        </div>

        <div class="setting">
            <label for="theme">Choose Theme</label>

            <select id="theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
        </div>

        <div class="setting">
            <label for="accent">Choose Accent Color</label>

            <select id="accent">
                <option value="purple">Purple</option>
                <option value="blue">Blue</option>
                <option value="green">Green</option>
            </select>
        </div>

        <button id="saveButton">Save Preferences</button>

        <button id="clearButton">Clear Preferences</button>

        <div id="message"></div>

        <div class="storage-info">
            <strong>localStorage:</strong>
            Theme and accent color are saved permanently.
            <br>
            <strong>sessionStorage:</strong>
            Username is saved for the current session.
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
