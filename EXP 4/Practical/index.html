<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Palindrome Checker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #667eea, #764ba2, #ff758c);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            padding: 40px;

            background-color: white;
            border-radius: 20px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;

            color: #6c5ce7;
            font-size: 30px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;

            color: #444;
            font-size: 17px;
            font-weight: bold;
        }

        #word {
            width: 100%;
            padding: 13px;

            font-size: 16px;

            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;

            transition: 0.3s;
        }

        #word:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 8px rgba(108, 92, 231, 0.3);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;

            background: linear-gradient(90deg, #6c5ce7, #fd79a8);

            color: white;
            font-size: 16px;
            font-weight: bold;

            border: none;
            border-radius: 10px;

            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }

        #result {
            min-height: 22px;
            margin-top: 25px;

            color: #6c5ce7;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Palindrome Checker</h1>

        <p class="subtitle">
            Enter a word and check if it reads the same backwards.
        </p>

        <label for="word">Enter a word:</label>

        <input
            type="text"
            id="word"
            
        >

        <button type="button" onclick="checkPalindrome()">
            Check Palindrome
        </button>

        <p id="result"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
