<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vehicle Registration Validator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #fce7f3;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 450px;
            background-color: white;

            border-radius: 18px;
            overflow: hidden;

            border: 1px solid #f5c2d7;

            box-shadow: 0 12px 35px rgba(157, 70, 107, 0.18);
        }

        .header {
            background-color: #be6f8f;
            color: white;

            text-align: center;
            padding: 30px 20px;
        }

        .icon {
            width: 60px;
            height: 60px;

            margin: 0 auto 15px;

            background-color: #fff0f6;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;
        }

        .header h2 {
            font-size: 25px;
            margin-bottom: 7px;
        }

        .header p {
            font-size: 14px;
            color: #fff0f6;
        }

        .form-area {
            padding: 35px;
        }

        label {
            display: block;

            font-size: 15px;
            font-weight: bold;

            color: #713c52;

            margin-bottom: 9px;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border: 2px solid #f0c6d7;
            border-radius: 9px;

            font-size: 17px;
            letter-spacing: 2px;

            background-color: #fffafb;

            outline: none;

            transition: 0.25s;
        }

        input:focus {
            border-color: #be6f8f;

            box-shadow: 0 0 0 4px rgba(190, 111, 143, 0.12);
        }

        input::placeholder {
            color: #b99aa7;
        }

        .example {
            margin-top: 8px;

            color: #956c7d;
            font-size: 13px;
        }

        button {
            width: 100%;

            margin-top: 25px;
            padding: 14px;

            background-color: #be6f8f;
            color: white;

            border: none;
            border-radius: 9px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        button:hover {
            background-color: #a95779;

            transform: translateY(-2px);

            box-shadow: 0 6px 15px rgba(169, 87, 121, 0.25);
        }

        #result {
            margin-top: 22px;

            padding: 13px;

            border-radius: 8px;

            font-size: 15px;
            font-weight: bold;

            text-align: center;
        }

        #result:empty {
            display: none;
        }

        .valid {
            background-color: #e8f7ed;
            color: #287a47;

            border: 1px solid #a8dbb8;
        }

        .invalid {
            background-color: #fde8ed;
            color: #b23a57;

            border: 1px solid #f2adbd;
        }

        .format-box {
            margin-top: 25px;

            background-color: #fff5f8;

            border: 1px solid #f3cfdd;
            border-radius: 9px;

            padding: 15px;

            text-align: center;
        }

        .format-box p {
            color: #956c7d;
            font-size: 13px;

            margin-bottom: 6px;
        }

        .format-box strong {
            color: #9d466b;

            letter-spacing: 2px;
            font-size: 17px;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="header">

            <div class="icon">
                🚗
            </div>

            <h2>Vehicle Registration Validator</h2>

            <p>Check whether a vehicle registration number is valid</p>

        </div>


        <div class="form-area">

            <label for="regNumber">
                Registration Number
            </label>

            <input
                type="text"
                id="regNumber"
                placeholder="MH12AB1234"
                maxlength="10"
            >

            <p class="example">
                Enter the registration number without spaces.
            </p>


            <button type="button" onclick="validateRegistration()">
                Validate Registration
            </button>


            <p id="result"></p>


            <div class="format-box">

                <p>Required Format</p>

                <strong>AA 00 AA 0000</strong>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        function validateRegistration() {

            const regNumber =
                document.getElementById("regNumber").value.trim();

            const result =
                document.getElementById("result");

            try {

                // Check empty input
                if (regNumber === "") {
                    throw new Error(
                        "Registration number cannot be empty."
                    );
                }


                // Check length
                if (regNumber.length !== 10) {
                    throw new Error(
                        "Registration number must be exactly 10 characters."
                    );
                }


                // First 2 characters = uppercase letters
                if (!/^[A-Z]{2}$/.test(regNumber.substring(0, 2))) {

                    throw new Error(
                        "First 2 characters must be uppercase alphabets."
                    );
                }


                // Characters 3 and 4 = digits
                if (!/^[0-9]{2}$/.test(regNumber.substring(2, 4))) {

                    throw new Error(
                        "Characters 3 and 4 must be digits."
                    );
                }


                // Characters 5 and 6 = uppercase letters
                if (!/^[A-Z]{2}$/.test(regNumber.substring(4, 6))) {

                    throw new Error(
                        "Characters 5 and 6 must be uppercase alphabets."
                    );
                }


                // Last 4 characters = digits
                if (!/^[0-9]{4}$/.test(regNumber.substring(6, 10))) {

                    throw new Error(
                        "Last 4 characters must be digits."
                    );
                }


                // VALID
                result.textContent =
                    "Valid Registration Number";

                result.className = "valid";


            } catch (error) {

                // INVALID
                result.textContent =
                    "Invalid: " + error.message;

                result.className = "invalid";
            }
        }

    </script>

</body>

</html>
