<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login Portal</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Segoe UI",sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#F5F1EA,#E8E2D8);
            padding:20px;
        }

        .box{
            width:500px;
            max-width:90%;
            background:#FFFFFF;
            padding:35px;
            border-radius:20px;
            border:1px solid #D6CEC2;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            color:#5C5248;
            margin-bottom:5px;
        }

        h2{
            text-align:center;
            color:#8B7D6B;
            margin-bottom:25px;
            font-size:18px;
            font-weight:400;
        }

        label{
            display:block;
            margin-bottom:8px;
            color:#6B6258;
            font-weight:600;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"]{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #D8D2C8;
            border-radius:10px;
            background:#FAF8F5;
            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#A99985;
        }

        .radio-group{
            display:flex;
            gap:20px;
            margin-bottom:20px;
            flex-wrap:wrap;
        }

        .requirements{
            background:#F7F4EF;
            padding:15px;
            border-radius:10px;
            border-left:5px solid #8B7D6B;
            margin-bottom:20px;
            color:#4A423A;
        }

        .requirements ul{
            margin-left:20px;
            margin-top:8px;
        }

        .requirements li{
            margin-bottom:4px;
        }

        button{
            width:100%;
            padding:13px;
            border:none;
            border-radius:10px;
            background:#8B7D6B;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#746658;
        }

        #output{
            margin-top:20px;
            padding:15px;
            border-radius:10px;
            background:#F7F4EF;
            border-left:5px solid #8B7D6B;
            color:#4A423A;
        }

    </style>
</head>

<body>

<div class="box">

    <h1>🔐 User Login Portal</h1>
    <h2>Student Registration Form</h2>

    <label>Full Name</label>
    <input type="text"
           id="name"
           placeholder="Enter your full name">

    <label>Email Address</label>
    <input type="text"
           id="email"
           placeholder="Enter your email">

    <label>Phone Number</label>
    <input type="number"
           id="phone"
           placeholder="Enter 10-digit phone number">

    <label>City</label>
    <input type="text"
           id="city"
           placeholder="Enter your city">

    <label>Gender</label>

    <div class="radio-group">
        <label>
            <input type="radio"
                   name="gender"
                   value="Male">
            Male
        </label>

        <label>
            <input type="radio"
                   name="gender"
                   value="Female">
            Female
        </label>

        <label>
            <input type="radio"
                   name="gender"
                   value="Other">
            Other
        </label>
    </div>

    <label>Role</label>

    <div class="radio-group">
        <label>
            <input type="radio"
                   name="role"
                   value="Student"
                   checked>
            Student
        </label>

        <label>
            <input type="radio"
                   name="role"
                   value="Faculty">
            Faculty
        </label>

        <label>
            <input type="radio"
                   name="role"
                   value="Admin">
            Admin
        </label>
    </div>

    <label>Password</label>
    <input type="password"
           id="password"
           placeholder="Enter Password">

    <div class="requirements">
        <strong>Password Requirements:</strong>

        <ul>
            <li>Minimum 8 characters</li>
            <li>At least 1 uppercase letter</li>
            <li>At least 1 lowercase letter</li>
            <li>At least 1 number</li>
            <li>At least 1 special character</li>
        </ul>
    </div>

    <label>Confirm Password</label>
    <input type="password"
           id="confirmPassword"
           placeholder="Confirm Password">

    <button onclick="login()">
        Login
    </button>

    <div id="output">
        Login status will appear here.
    </div>

</div>

<script src="script1.js"></script>

</body>
</html>
