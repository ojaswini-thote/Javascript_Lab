<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grading System</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg, #F5F1EA, #E8E2D8);
        }

        .container{
            width:450px;
            background:#fff;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
            border:1px solid #D6CEC2;
        }

        h2{
            text-align:center;
            color:#5C5248;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
            color:#6B6258;
        }

        input[type="text"],
        input[type="number"]{
            width:100%;
            padding:12px;
            margin-bottom:18px;
            border:1px solid #D8D2C8;
            border-radius:10px;
            background:#FAF8F5;
            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#A99985;
        }

        .radio-group{
            display:flex;
            gap:15px;
            margin-bottom:20px;
            flex-wrap:wrap;
        }

        .radio-group label{
            font-weight:normal;
            color:#4A423A;
        }

        input[type="button"]{
            width:100%;
            padding:13px;
            border:none;
            border-radius:10px;
            background:#8B7D6B;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        input[type="button"]:hover{
            background:#746658;
        }

        .result-box{
            margin-top:25px;
            background:#F7F4EF;
            padding:15px;
            border-radius:10px;
            border-left:5px solid #8B7D6B;
        }

        .result-box h3{
            color:#5C5248;
            margin-bottom:10px;
        }

        #result{
            line-height:1.8;
            color:#4A423A;
        }
    </style>
</head>
<body>

    <div class="container">

        <h2>🎓 Student Grading System</h2>

        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>Roll Number</label>
        <input type="text" id="roll" placeholder="Enter roll number">

        <label>Subject Name</label>
        <input type="text" id="subject" placeholder="Enter subject name">

        <label>Semester</label>

<div class="radio-group">

    <label>
        <input type="radio" name="semester" value="Semester 1">
        Semester 1
    </label>

    <label>
        <input type="radio" name="semester" value="Semester 2">
        Semester 2
    </label>

    <label>
        <input type="radio" name="semester" value="Semester 3">
        Semester 3
    </label>

    <label>
        <input type="radio" name="semester" value="Semester 4">
        Semester 4
    </label>

    <label>
        <input type="radio" name="semester" value="Semester 5">
        Semester 5
    </label>

    <label>
        <input type="radio" name="semester" value="Semester 6">
        Semester 6
    </label>

</div>

        <label>Marks</label>
        <input type="number" id="marks" placeholder="Enter marks (0-100)">

        <input type="button"
               value="Calculate Grade"
               onclick="gradeSystem()">

        <div class="result-box">
            <h3>Result</h3>
            <p id="result">Student details will appear here.</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
