<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Your Profile</title>

    <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        padding: 50px 20px;
        font-family: "DM Sans", sans-serif;

        background:
            radial-gradient(circle at 10% 20%, #d8cdf0 0, transparent 25%),
            radial-gradient(circle at 90% 80%, #c9dfef 0, transparent 28%),
            radial-gradient(circle at 85% 15%, #f1d8df 0, transparent 22%),
            #f3f1f7;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 100%;
        max-width: 680px;
        background: #ffffff;
        border-radius: 24px;
        overflow: hidden;

        border: 1px solid #ded5e8;

        box-shadow:
            0 20px 50px rgba(84, 65, 112, 0.18),
            0 4px 12px rgba(84, 65, 112, 0.08);
    }

    .header {
        padding: 35px 42px 28px;

        background:
            linear-gradient(
                135deg,
                #e7ddf5,
                #dcebf5
            );

        border-bottom: 1px solid #d5cae3;
        position: relative;
    }

    .header::after {
    content: "✎";
    position: absolute;
    right: 40px;
    top: 25px;
    font-size: 36px;
    color: #8d72b5;
    opacity: 0.7;
}

    h1 {
        margin: 0 0 8px;
        font-family: "Playfair Display", serif;
        font-size: 34px;
        color: #4d3f66;
        letter-spacing: -0.5px;
    }

    .header p {
        margin: 0;
        color: #70667d;
        font-size: 15px;
    }

    .required-note {
        margin: 0;
        padding: 15px 42px;

        background: #faf7fc;

        border-bottom: 1px solid #eee7f2;

        color: #96707d;
        font-size: 13px;
        font-weight: 600;
    }

    form {
        padding: 30px 42px 42px;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #514860;
        font-size: 14px;
        font-weight: 700;
    }

    .star {
        color: #bd6678;
    }

    .optional {
        color: #968f9e;
        font-size: 12px;
        font-weight: 500;
    }

    input,
    select {
        width: 100%;
        padding: 13px 14px;

        border: 1.5px solid #d9d0e2;
        border-radius: 11px;

        background: #fcfbfd;
        color: #4e4659;

        font-family: inherit;
        font-size: 14px;

        outline: none;

        transition:
            border-color 0.2s,
            box-shadow 0.2s,
            transform 0.2s;
    }

    input:hover,
    select:hover {
        border-color: #b8a6cf;
    }

    input:focus,
    select:focus {
        background: #ffffff;
        border-color: #937ab6;

        box-shadow:
            0 0 0 4px rgba(147, 122, 182, 0.14);
    }

    .dob-row {
        display: grid;
        grid-template-columns: 1fr 1.4fr 1fr;
        gap: 10px;
    }

    .checkbox-group {
        display: flex;
        align-items: center;
        gap: 12px;

        margin: 25px 0;

        padding: 17px;

        background:
            linear-gradient(
                135deg,
                #f6f1fa,
                #f2f7fb
            );

        border: 1px solid #ded5e8;
        border-radius: 14px;
    }

    .checkbox-group input {
        width: 18px;
        height: 18px;

        margin: 0;

        accent-color: #8e73b3;
        cursor: pointer;
    }

    .checkbox-group label {
        margin: 0;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
    }

    #submitBtn {
        width: 100%;

        padding: 15px;

        border: none;
        border-radius: 12px;

        background:
            linear-gradient(
                135deg,
                #8d72b5,
                #a482bd
            );

        color: white;

        font-family: inherit;
        font-size: 15px;
        font-weight: 700;

        letter-spacing: 0.2px;

        cursor: pointer;

        box-shadow:
            0 8px 18px rgba(141, 114, 181, 0.28);

        transition:
            transform 0.2s,
            box-shadow 0.2s;
    }

    #submitBtn:hover {
        transform: translateY(-2px);

        box-shadow:
            0 12px 24px rgba(141, 114, 181, 0.35);
    }

    #submitBtn:active {
        transform: translateY(0);
    }

    #message {
        display: none;

        margin: 20px 0 0;
        padding: 13px;

        border-radius: 10px;

        text-align: center;
        font-size: 14px;
        font-weight: 600;
    }

    .error {
        display: block !important;
        background: #f9e7ea;
        color: #a65365;
        border: 1px solid #edc8d0;
    }

    .success {
        display: block !important;
        background: #e6f2ea;
        color: #4f8060;
        border: 1px solid #c6dfce;
    }

    @media (max-width: 600px) {

        body {
            padding: 25px 15px;
        }

        .header {
            padding: 28px 25px;
        }

        form {
            padding: 25px;
        }

        .required-note {
            padding: 15px 25px;
        }

        .form-row {
            grid-template-columns: 1fr;
            gap: 0;
        }

        h1 {
            font-size: 28px;
        }
    }
</style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Create Your Profile</h1>
            <p>Enter your details to create your account.</p>
        </div>

        <p class="required-note">
            <span class="star">*</span> Required fields
        </p>

        <form id="registrationForm">

            <div class="form-row">

                <div class="form-group">
                    <label for="firstName">
                        First Name <span class="star">*</span>
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter your first name"
                    >
                </div>

                <div class="form-group">
                    <label for="lastName">
                        Last Name <span class="star">*</span>
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter your last name"
                    >
                </div>

            </div>


            <div class="form-group">

    <label>
        Date of Birth <span class="star">*</span>
    </label>

    <div class="dob-row">

        <select id="day">
            <option value="">Day</option>
        </select>

        <select id="month">
            <option value="">Month</option>
        </select>

        <select id="year">
            <option value="">Year</option>
        </select>

    </div>

</div>


            <div class="form-group">

                <label for="username">
                    Username <span class="star">*</span>
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Choose a username"
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address <span class="star">*</span>
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password <span class="star">*</span>
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                >

            </div>
            <div class="form-group">

    <label for="confirmPassword">
        Re-enter Password <span class="star">*</span>
    </label>

    <input
        type="password"
        id="confirmPassword"
        placeholder="Re-enter your password"
    >

</div>


            <div class="form-group">

                <label for="website">
                    Personal Website
                    <span class="optional">(Optional)</span>
                </label>

                <input
                    type="url"
                    id="website"
                    placeholder="https://example.com"
                >

            </div>


            <div class="checkbox-group">

                <input type="checkbox" id="terms">

                <label for="terms">
                    I agree to the
                    <strong>Terms and Conditions</strong>
                    <span class="star">*</span>
                </label>

            </div>


            <button type="submit" id="submitBtn">
                Create Profile
            </button>


            <div id="message"></div>

        </form>

    </div>

    <script src="script1.js"></script>

</body>
</html>
