<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>String Processing using JavaScript</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #eee4d3;
            color: #3d352d;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
            background: #fffdf8;
            padding: 35px;
            border-radius: 14px;
            border: 1px solid #ded2bf;
            box-shadow: 0 8px 25px rgba(75, 60, 45, 0.15);
        }

        h1 {
            text-align: center;
            margin: 0 0 30px;
            color: #59483a;
            font-size: 30px;
            font-weight: 600;
        }

        .input-section {
            background: #f7f1e7;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #e2d6c4;
        }

        label {
            display: block;
            margin-bottom: 8px;
            margin-top: 12px;
            font-weight: 600;
            color: #59483a;
        }

        textarea,
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cdbfae;
            border-radius: 7px;
            background: #fffdf9;
            color: #3d352d;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        textarea:focus,
        input:focus {
            outline: none;
            border-color: #9a8065;
            box-shadow: 0 0 0 3px rgba(154, 128, 101, 0.12);
        }

        textarea::placeholder,
        input::placeholder {
            color: #9b9083;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #806b55;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #6d5947;
        }

        .results {
            margin-top: 30px;
        }

        h2 {
            margin-bottom: 18px;
            color: #59483a;
            font-size: 23px;
            border-bottom: 2px solid #b6a087;
            padding-bottom: 8px;
        }

        #result p {
            background: #faf6ef;
            border: 1px solid #e3d8c8;
            border-left: 4px solid #9a8065;
            border-radius: 7px;
            padding: 15px 17px;
            margin: 12px 0;
            line-height: 1.6;
        }

        #result strong {
            color: #59483a;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .container {
                width: 95%;
                padding: 22px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>String Processing using JavaScript</h1>

        <div class="input-section">

            <label for="paragraph">Enter Paragraph:</label>

            <textarea
                id="paragraph"
                placeholder="Enter your paragraph here..."
            ></textarea>

            <label for="email">Enter Email:</label>

            <input
                type="text"
                id="email"
                placeholder="Enter email address"
            >

            <button onclick="processString()">
                Process String
            </button>

        </div>

        <div class="results">

            <h2>Results</h2>

            <div id="result"></div>

        </div>

    </div>

    <script src="script1.js"></script>

</body>

</html>
